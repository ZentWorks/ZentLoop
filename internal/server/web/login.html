<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0a0d10">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="ZentLoop">
  <title>ZentLoop Admin Login</title>
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="apple-touch-icon" href="/zentloop-logo.png">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="stylesheet" href="/login.css">
</head>
<body>
  <main class="login-shell">
    <section class="login-card" aria-labelledby="loginTitle">
      <div class="login-brand">
        <img src="/zentloop-logo.png" alt="ZentLoop">
        <div><small>ADMIN CONTROL</small><h1 id="loginTitle">ZentLoop</h1><p>Sign in to the local operator interface.</p></div>
      </div>
      <form id="loginForm" novalidate>
        <label for="username">Username</label>
        <input id="username" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" required>
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>
        <button id="loginButton" type="submit">Sign in</button>
        <p id="loginStatus" class="login-status" role="status" aria-live="polite"></p>
      </form>
      <footer>Protected ZentLoop administration</footer>
    </section>
  </main>
  <script src="/login.js"></script>
</body>
</html>
