services:
  zentloop:
    image: ghcr.io/zentworks/zentloop:latest
    container_name: zentloop
    restart: unless-stopped
    environment:
      ZENTLOOP_TRAP_ADDR: ":8080"
      ZENTLOOP_ADMIN_ADDR: ":9090"
      ZENTLOOP_ADMIN_USER: "${ZENTLOOP_ADMIN_USER:-admin}"
      ZENTLOOP_ADMIN_PASSWORD: "${ZENTLOOP_ADMIN_PASSWORD:-}"
      ZENTLOOP_PROXY_MODE: "${ZENTLOOP_PROXY_MODE:-auto}"
      ZENTLOOP_PROXY_RULES: "${ZENTLOOP_PROXY_RULES:-}"
      ZENTLOOP_SUSPICIOUS_THRESHOLD: "${ZENTLOOP_SUSPICIOUS_THRESHOLD:-30}"
      ZENTLOOP_HOSTILE_THRESHOLD: "${ZENTLOOP_HOSTILE_THRESHOLD:-60}"
      ZENTLOOP_MAX_DELAY_MS: "${ZENTLOOP_MAX_DELAY_MS:-1500}"
      ZENTLOOP_MAX_CONCURRENT: "${ZENTLOOP_MAX_CONCURRENT:-256}"
      ZENTLOOP_LIVE_SESSION_MINUTES: "${ZENTLOOP_LIVE_SESSION_MINUTES:-5}"
      ZENTLOOP_RESUME_WINDOW_HOURS: "${ZENTLOOP_RESUME_WINDOW_HOURS:-720}"
      ZENTLOOP_RETENTION_DAYS: "${ZENTLOOP_RETENTION_DAYS:-30}"
      ZENTLOOP_DATA_DIR: "/data"
      ZENTLOOP_GEOIP_DB: "${ZENTLOOP_GEOIP_DB:-/data/dbip-country-lite.mmdb}"
      ZENTLOOP_GEOIP_AUTO_UPDATE: "${ZENTLOOP_GEOIP_AUTO_UPDATE:-true}"
      ZENTLOOP_OFFICIAL_BOTS_ENABLED: "${ZENTLOOP_OFFICIAL_BOTS_ENABLED:-true}"
      ZENTLOOP_OFFICIAL_BOTS_REFRESH_HOURS: "${ZENTLOOP_OFFICIAL_BOTS_REFRESH_HOURS:-24}"
      ZENTLOOP_OFFICIAL_BOTS_CACHE: "${ZENTLOOP_OFFICIAL_BOTS_CACHE:-/data/official-bots.json}"
      ZENTLOOP_INTEGRATION_SECRET: "${ZENTLOOP_INTEGRATION_SECRET:-}"
      ZENTLOOP_INTEGRATION_MAX_SKEW_SECONDS: "${ZENTLOOP_INTEGRATION_MAX_SKEW_SECONDS:-300}"
      ZENTLOOP_SSH_ENABLED: "${ZENTLOOP_SSH_ENABLED:-false}"
      ZENTLOOP_SSH_ADDR: "${ZENTLOOP_SSH_ADDR:-0.0.0.0:22}"
      ZENTLOOP_SSH_HOST_KEY_PATH: "${ZENTLOOP_SSH_HOST_KEY_PATH:-/data/ssh_trap_host_ed25519_key}"
      ZENTLOOP_SSH_MAX_CONCURRENT: "${ZENTLOOP_SSH_MAX_CONCURRENT:-64}"
      ZENTLOOP_SSH_MAX_PER_IP: "${ZENTLOOP_SSH_MAX_PER_IP:-4}"
      ZENTLOOP_SSH_IDLE_SECONDS: "${ZENTLOOP_SSH_IDLE_SECONDS:-120}"
      ZENTLOOP_SSH_MAX_SESSION_MINUTES: "${ZENTLOOP_SSH_MAX_SESSION_MINUTES:-30}"
      ZENTLOOP_SSH_MAX_AUTH_TRIES: "${ZENTLOOP_SSH_MAX_AUTH_TRIES:-6}"
      ZENTLOOP_ADMIN_SSH_ENABLED: "${ZENTLOOP_ADMIN_SSH_ENABLED:-false}"
      ZENTLOOP_ADMIN_SSH_ADDR: "${ZENTLOOP_ADMIN_SSH_ADDR:-0.0.0.0:22222}"
      ZENTLOOP_ADMIN_SSH_USER: "${ZENTLOOP_ADMIN_SSH_USER:-}"
      ZENTLOOP_ADMIN_SSH_AUTHORIZED_KEY: "${ZENTLOOP_ADMIN_SSH_AUTHORIZED_KEY:-}"
      ZENTLOOP_ADMIN_SSH_HOST_KEY_PATH: "${ZENTLOOP_ADMIN_SSH_HOST_KEY_PATH:-/data/ssh_host_ed25519_key}"
      TZ: "${TZ:-Europe/Berlin}"
      ZENTLOOP_BENIGN_DIR: "/site"
    ports:
      - "${ZENTLOOP_PUBLIC_PORT:-8080}:8080"
      - "${ZENTLOOP_SSH_PUBLIC_PORT:-2222}:22"
      - "${ZENTLOOP_ADMIN_BIND:-127.0.0.1}:${ZENTLOOP_ADMIN_PORT:-9090}:9090"
      - "${ZENTLOOP_ADMIN_SSH_BIND:-127.0.0.1}:${ZENTLOOP_ADMIN_SSH_PORT:-22222}:22222"
    volumes:
      - zentloop-data:/data
      - ./site:/site:ro
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    read_only: true
    sysctls:
      net.ipv4.ip_unprivileged_port_start: "22"
    tmpfs:
      - /tmp:size=16m,noexec,nosuid,nodev

volumes:
  zentloop-data:
